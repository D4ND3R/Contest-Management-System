name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: make lint
      - name: build
        run: make build
      - name: sqlc generated code is up to date
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin sqlc
          make generate
          git diff --exit-code -- internal/db/sqlc

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      CMS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      CMS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - name: start MinIO (S3 blob backend tests)
        run: |
          docker run -d --name minio -p 59000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin pgsty/minio:latest server /data
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:59000/minio/health/live && break; sleep 1; done
          echo "CMS_TEST_S3_ENDPOINT=127.0.0.1:59000" >> "$GITHUB_ENV"
          echo "CMS_TEST_S3_ACCESS_KEY=minioadmin" >> "$GITHUB_ENV"
          echo "CMS_TEST_S3_SECRET_KEY=minioadmin" >> "$GITHUB_ENV"
      - name: go test -race
        run: go test -count=1 -race ./...

  sandbox:
    # isolate v2 with cgroup v2 (systemd-delegated) on a real runner: the
    # malicious-program battery and sandbox integration tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - name: install isolate
        run: sudo scripts/install-isolate.sh v2.7
      - name: check environment
        run: sudo isolate-check-environment || true
      - name: sandbox tests (run as root)
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            CMS_SANDBOX_TESTS=1 go test -count=1 -v ./internal/sandbox/ ./internal/worker/ 2>&1 | tee sandbox.log
          grep -q "^ok" sandbox.log

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build cms image
        uses: docker/build-push-action@v6
        with: {context: ., target: cms, push: false, tags: "cms:ci"}
