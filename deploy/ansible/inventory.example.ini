# Copy to inventory.ini and adapt. One main server; any number of workers.
# cms_private_ip is the main server's address on the network the workers
# share with it (Redis and the blob server listen there).

[cms_main]
cms-main.example.org cms_private_ip=10.8.0.1

[cms_workers]
judge-01 ansible_host=10.8.0.11
judge-02 ansible_host=10.8.0.12
