{{define "content"}}
{{$a := .Data.A}}
<h1>{{.T "Administrator %s" $a.Username}}</h1>
<form method="post" action="/admins/{{$a.ID}}" class="card">
{{template "csrf" .CSRF}}
<fieldset {{if not .CanWrite}}disabled{{end}}>
<div class="grid">
  <label>{{.T "Username"}} <input name="username" value="{{$a.Username}}" required autocomplete="off"></label>
  <label>{{.T "Name"}} <input name="name" value="{{$a.Name}}"></label>
  <label>{{.T "Role"}} <select name="role">{{range .Data.Roles}}<option {{if eq . $a.Role}}selected{{end}}>{{.}}</option>{{end}}</select></label>
  <label>{{.T "New password"}} <input type="password" name="password" minlength="8" autocomplete="new-password" placeholder="{{.T "leave empty to keep"}}"></label>
</div>
<p class="checks"><label><input type="checkbox" name="enabled" {{if $a.Enabled}}checked{{end}}> {{.T "Enabled"}}</label>
  {{if $a.TotpSecret}}<label><input type="checkbox" name="reset_2fa"> {{.T "Reset two-factor authentication (lost device)"}}</label>{{end}}</p>
{{if .CanWrite}}<button>{{.T "Save"}}</button>{{end}}
</fieldset>
</form>
<p><a href="/audit?admin={{$a.ID}}">{{.T "Actions of %s" $a.Username}}</a></p>
{{if .CanWrite}}
<form method="post" action="/admins/{{$a.ID}}/delete" class="card danger" data-confirm="{{.T "Delete administrator %s?" $a.Username}}">
  {{template "csrf" .CSRF}}<button class="danger">{{.T "Delete administrator"}}</button>
</form>
{{end}}
{{end}}
