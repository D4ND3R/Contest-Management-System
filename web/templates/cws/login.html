{{define "content"}}
<div class="narrow">
<h1>{{.T "Log in"}}</h1>
{{with .Contest.Subheading}}<p class="muted">{{.}}</p>{{end}}
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="{{.Base}}login">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>{{.T "Username"}} <input name="username" autocomplete="username" required autofocus></label>
  <label>{{.T "Password"}} <input type="password" name="password" autocomplete="current-password" required></label>
  <p><button class="primary">{{.T "Log in"}}</button></p>
</form>
{{if .RegisterOpen}}<p class="muted">{{.T "No account yet?"}} <a href="{{.Base}}register">{{.T "Register"}}</a></p>{{end}}
</div>
{{end}}
