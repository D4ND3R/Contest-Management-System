{{define "content"}}
<section class="card narrow">
<h1>{{.T "Log in"}}</h1>
{{with .Contest.Description}}<p class="muted">{{.}}</p>{{end}}
{{with .Error}}<p class="alert">{{.}}</p>{{end}}
<form method="post" action="{{.Base}}login">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>{{.T "Username"}} <input name="username" autocomplete="username" required autofocus></label>
  <label>{{.T "Password"}} <input type="password" name="password" autocomplete="current-password" required></label>
  <button>{{.T "Log in"}}</button>
</form>
{{if .RegisterOpen}}<p>{{.T "No account yet?"}} <a href="{{.Base}}register">{{.T "Register"}}</a></p>{{end}}
</section>
{{end}}
