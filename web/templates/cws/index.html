{{define "content"}}
<h1>{{.T "Contests"}}</h1>
{{if .Data}}
<table>
<tr><th>{{.T "Contest"}}</th><th>{{.T "Start"}}</th><th>{{.T "End"}}</th></tr>
{{range .Data}}<tr><td><a href="/{{.Name}}/">{{.Name}}</a> <span class="muted">{{.Description}}</span></td><td>{{$.DateTime .StartTime}}</td><td>{{$.DateTime .StopTime}}</td></tr>{{end}}
</table>
{{else}}<p class="muted">{{.T "There are no contests."}}</p>{{end}}
{{end}}
