{{define "content"}}{{$d := .Data}}
<h1>{{.T "Clarifications"}}</h1>
{{if $d.CanAsk}}
<form method="post" action="{{.Base}}questions" id="ask">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="row">
    <label>{{.T "About"}} <select name="task"><option value="">{{.T "General"}}</option>{{range $i, $t := .Tasks}}<option value="{{$t.Name}}">{{letter $i}}. {{$t.Name}} — {{$t.Title}}</option>{{end}}</select></label>
  </div>
  <label>{{.T "Question"}} <textarea name="text" rows="3" maxlength="4000" required></textarea></label>
  <p><button class="primary">{{.T "Send question"}}</button>
    <span class="muted small">{{.T "The organizers answer you, or everyone when the answer concerns all contestants."}}</span></p>
</form>
{{else}}<p class="muted">{{.T "Questions are closed."}}</p>{{end}}
<p class="actions-bar small">
  <button type="button" id="sound-toggle" class="link" data-on="{{.T "Sound: on"}}" data-off="{{.T "Sound: off"}}">{{.T "Sound: off"}}</button>
  <button type="button" id="enable-notifications" class="link" hidden>{{.T "Enable desktop notifications"}}</button>
</p>
{{template "communication" .}}
{{end}}
