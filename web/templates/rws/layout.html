{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{static "style.css"}}">
<link rel="stylesheet" href="{{static "rws.css"}}">
{{if .Live}}<meta name="rws-events" content="/{{.Name}}/events" data-seq="{{.Seq}}"><script src="{{static "rws.js"}}" defer></script>{{end}}
</head>
<body class="rws">
<header class="topbar">
  <a class="brand" href="/"><span class="logo">{{icon "logo"}}</span><span><b>CMS</b><small>{{.T "Ranking"}}</small></span></a>
  <div class="crumbs">{{if .Board}}<a href="/{{.Name}}/">{{icon "trophy"}}</a><b>{{.Board.Title}}</b>{{end}}</div>
  {{if .Live}}<div class="top-right"><span id="live" class="pill ok live">{{.T "live"}}</span></div>{{end}}
</header>
<main id="main" class="content">
{{template "content" .}}
</main>
</body>
</html>{{end}}
