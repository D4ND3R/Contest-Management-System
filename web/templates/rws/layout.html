{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}"{{with .Display.Theme}} data-theme="{{.}}"{{end}}{{with .Display.Size}} data-size="{{.}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{static "style.css"}}">
<link rel="stylesheet" href="{{static "rws.css"}}">
{{if .Live}}<meta name="rws-events" content="/{{.Name}}/events" data-seq="{{.Seq}}">{{end}}
<script src="{{static "rws.js"}}" defer></script>
</head>
<body>
<a class="skip" href="#main">{{.T "Skip to content"}}</a>
<header class="head">
<div class="wrap wide">
  <div class="bar">
    <a class="brand" href="/">{{.T "Ranking"}}</a>
    {{if .Board}}<a href="/{{.Name}}/"><b>{{.Board.Title}}</b></a>{{end}}
    <span class="spacer"></span>
    {{if .Live}}<span id="live" class="phase phase-on">{{.T "live"}}</span>{{end}}
  </div>
</div>
</header>
<main id="main" class="wrap wide">
{{template "content" .}}
</main>
<footer class="foot">
<div class="wrap wide">
  <form method="get" action="{{.Path}}" class="prefs" id="prefs">
    <label for="ui-lang">{{.T "Language"}}</label>
    <select id="ui-lang" name="lang" data-reload>{{range .Languages}}<option value="{{.Value}}" lang="{{.Value}}" {{if eq .Value $.Lang}}selected{{end}}>{{.Label}}</option>{{end}}</select>
    <label for="ui-theme">{{.T "Theme"}}</label>
    <select id="ui-theme" name="theme" data-attr="theme">{{range .Themes}}<option value="{{.Value}}" {{if eq .Value $.Display.Theme}}selected{{end}}>{{.Label}}</option>{{end}}</select>
    <label for="ui-size">{{.T "Text size"}}</label>
    <select id="ui-size" name="size" data-attr="size">{{range .Sizes}}<option value="{{.Value}}" {{if eq .Value $.Display.Size}}selected{{end}}>{{.Label}}</option>{{end}}</select>
    <button class="apply">{{.T "Apply"}}</button>
  </form>
  <span>{{with .Board}}{{$.T "Times in %s" .Timezone}}{{end}}</span>
</div>
</footer>
</body>
</html>{{end}}
